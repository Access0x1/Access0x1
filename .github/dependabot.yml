# ⏸️  VERSION UPDATES ARE PAUSED (2026-08-24). Every `open-pull-requests-limit` below is 0,
#     which is GitHub's documented switch for "stop version updates". SECURITY updates are
#     UNAFFECTED and still open PRs — that safety net stays on.
#
#     WHY. Repo ruleset `protect-all-branches` (id 17630972) targets `~ALL` with
#     `non_fast_forward`. A Dependabot rebase or recreate IS a force-push, so Dependabot can run
#     its update job and can never push the result to its own branch. Every PR it opened went
#     stale the moment main moved and could never be refreshed — four sat unmergeable from
#     2026-07-25 to 2026-08-24. `@dependabot rebase` answers "edited by someone other than
#     Dependabot"; `@dependabot recreate` answers "because the branch is protected it was unable
#     to do so". The backlog was never neglect; the bot was structurally unable to maintain it.
#
#     TO RE-ENABLE, fix the cause first, then set the limits back to 5:
#       exclude `refs/heads/dependabot/**` from `protect-all-branches`, or add Dependabot as a
#       bypass actor. That is a branch-protection change and an owner decision, and it sits
#       against the repo law "no force-push ever, on any branch" — the question is whether that
#       law is meant to cover a bot's own scratch branches.
#
#     MEANWHILE, take bumps DIRECTLY: bump the version, regenerate the lockfile, gate, commit,
#     the way PR #331 (TypeScript 7) landed. That verified better anyway — on the merged tree
#     rather than against a stale base.
#
#     ⛔ NEVER run `gh pr update-branch` on a Dependabot PR. It is a git MERGE, and git splices
#     package.json and package-lock.json as two unrelated text files. Dependabot regenerates a
#     lockfile; a merge only splices one. Doing this on #324 desynced web/package-lock.json and
#     took main's Web app lane red (fixed in #332).
#
# Dependabot keeps Access0x1's dependencies current and the updates transparent:
# it opens a PR (never auto-merges) whenever a tracked manifest has a newer or
# security-patched dependency, so every bump is reviewed in the open.
#
# Scope notes (honesty — money-safety invariant #4: claim only what's here):
#   - npm: one entry per directory that has its OWN package.json + committed
#     lockfile (this repo uses no npm workspaces, so each is independent):
#     "/" (Solidity @chainlink/contracts manifest), web/, snap/,
#     packages/react/, subgraph/. Directories with a package.json but NO
#     committed lockfile (cre/, packages/create-access0x1/, templates/starter/*)
#     are intentionally omitted to avoid lockfile-less update noise.
#   - github-actions: the workflows under .github/workflows pin third-party
#     actions (checkout, foundry-toolchain, setup-node) — tracked so pinned
#     action versions stay current.
#   - pip is NOT configured: the only Python project (vyper/) is a Moccasin
#     (mox) project described by moccasin.toml, which Dependabot's pip ecosystem
#     does not parse (it needs requirements.txt / pyproject.toml / Pipfile /
#     setup.py). Adding it would create a broken entry, so it is left out.
#   - docker is NOT configured: the repo ships no Dockerfile / compose file.
#
# Reference: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # --- Solidity dependency manifest (Foundry resolves @chainlink/contracts here) ---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - "Access0x1"
    open-pull-requests-limit: 0  # version updates PAUSED — see the header note
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      npm-root-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # --- web/ (Next.js app) ---
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    reviewers:
      - "Access0x1"
    open-pull-requests-limit: 0  # version updates PAUSED — see the header note
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      web-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # --- snap/ (MetaMask Snap) ---
  - package-ecosystem: "npm"
    directory: "/snap"
    schedule:
      interval: "weekly"
    reviewers:
      - "Access0x1"
    open-pull-requests-limit: 0  # version updates PAUSED — see the header note
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      snap-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # --- packages/react/ (published @access0x1/react SDK) ---
  - package-ecosystem: "npm"
    directory: "/packages/react"
    schedule:
      interval: "weekly"
    reviewers:
      - "Access0x1"
    open-pull-requests-limit: 0  # version updates PAUSED — see the header note
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      react-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # --- subgraph/ (The Graph indexing) ---
  - package-ecosystem: "npm"
    directory: "/subgraph"
    schedule:
      interval: "weekly"
    reviewers:
      - "Access0x1"
    open-pull-requests-limit: 0  # version updates PAUSED — see the header note
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      subgraph-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # --- GitHub Actions used by the CI / audit workflows ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - "Access0x1"
    open-pull-requests-limit: 0  # version updates PAUSED — see the header note
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
